<html>
  <head>
    <script>
      const loc = window.location;
      function fullscreen() {
        loc.href = 'https://www.youtube.com/redirect?q=' + encodeURIComponent(loc.origin + loc.pathname + '?q=fullscreen');
      }
      if (loc.search !== '?q=fullscreen') {
        fullscreen();
      }
      function search() {
        let keyword = document.getElementById('keyword').value;
        loc.href = 'https://www.youtube.com/redirect?q=' + encodeURIComponent('https://www.google.com/search?q=' + encodeURIComponent(keyword));
      }
    </script>
    <style>
      body > * {
        margin-bottom: 20px;
      }
      .books {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .books a {
        width: 200px;
        height: 280px;

        justify-content: center;
        display: flex;
        align-items: center;
      }
      .books a > * {
        width: 100%;
      }
    </style>
  </head>
  <body>
    <a href="javascript:fullscreen()">Fullscreen</a>
    <input type="text" id="keyword">
    <button onclick="javascript:search()">Search</button>
    <br />
